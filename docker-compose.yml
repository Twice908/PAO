services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: pao-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: pao
      POSTGRES_PASSWORD: pao
      POSTGRES_DB: pao
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pao -d pao"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pao-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
