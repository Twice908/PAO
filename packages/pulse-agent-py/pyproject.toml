[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pulse-agent"
version = "0.1.0"
description = "Pulse Agent Observe (PAO) SDK for AI agent observability"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Pulse" }]
dependencies = [
    "httpx>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://usepulse.dev"

[tool.hatch.build.targets.wheel]
packages = ["src/pulse_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
